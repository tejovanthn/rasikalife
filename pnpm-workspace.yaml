packages:
  - packages/*

# pnpm 12 replaced onlyBuiltDependencies with allowBuilds and now refuses to install until
# every package with a build script is explicitly allowed or denied. Same list as before.
allowBuilds:
  '@biomejs/biome': true
  aws-sdk: true
  esbuild: true
  protobufjs: true
  sharp: true
  vite-plugin-node-externals: true

supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc

# Match the lockfile. The root vitest relies on it: vitest 5 takes vite as a peer, and the root
# has no vite of its own, so this is what installs vite 8 for it.
autoInstallPeers: true
