<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The Lambda image ships no fonts, so librsvg drew every letter as a box. These are the
     fonts the cards name (DejaVu Sans, Bitstream Vera licence). FONTCONFIG_PATH points here. -->
<fontconfig>
  <dir>/var/task/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <config></config>
</fontconfig>
